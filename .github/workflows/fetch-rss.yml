name: Fetch Vringe RSS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install googletrans==4.0.0-rc1

      - name: Fetch RSS, translate, and convert to JSON
        run: |
          curl -s 'https://vringe.com/export/rss/all.xml' -o feed.xml
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET, json, sys, time

          try:
              from googletrans import Translator
              translator = Translator()
              HAS_TRANS = True
              print('Translator loaded')
          except Exception as e:
              HAS_TRANS = False
              print(f'Translator unavailable: {e}')

          tree = ET.parse('feed.xml')
          items = []

          for item in tree.findall('.//item'):
              enc = item.find('enclosure')
              title = (item.findtext('title') or '').strip()

              title_en = ''
              title_fr = ''

              if title and HAS_TRANS:
                  for attempt in range(3):
                      try:
                          result_en = translator.translate(title, src='ru', dest='en')
                          title_en = result_en.text
                          break
                      except Exception as e:
                          print(f'EN attempt {attempt+1} failed: {e}')
                          time.sleep(1)

                  for attempt in range(3):
                      try:
                          result_fr = translator.translate(title, src='ru', dest='fr')
                          title_fr = result_fr.text
                          break
                      except Exception as e:
                          print(f'FR attempt {attempt+1} failed: {e}')
                          time.sleep(1)

                  time.sleep(0.5)

              items.append({
                  'title': title,
                  'title_en': title_en,
                  'title_fr': title_fr,
                  'link': (item.findtext('link') or '').strip(),
                  'description': (item.findtext('description') or '').strip(),
                  'image': enc.get('url','') if enc is not None else '',
                  'pubDate': (item.findtext('pubDate') or '').strip()
              })

          with open('feed.json','w',encoding='utf-8') as f:
              json.dump({'items': items, 'fetched': __import__('datetime').datetime.utcnow().isoformat()+'Z'}, f, ensure_ascii=False)
          print(f'{len(items)} articles saved')
          PYEOF
          rm -f feed.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Update feed.json" && git push
