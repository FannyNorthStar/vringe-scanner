name: Fetch Vringe RSS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS, translate, and convert to JSON
        run: |
          curl -s 'https://vringe.com/export/rss/all.xml' -o feed.xml
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET, json, sys, time, urllib.request, urllib.parse

          def translate(text, target_lang):
              """Use Google Translate free API (no key needed)."""
              if not text.strip():
                  return ''
              try:
                  encoded = urllib.parse.quote(text)
                  url = f'https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl={target_lang}&dt=t&q={encoded}'
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                      return ''.join(part[0] for part in data[0] if part[0])
              except Exception as e:
                  print(f'  translate({target_lang}) error: {e}')
                  return ''

          tree = ET.parse('feed.xml')
          items = []

          for i, item in enumerate(tree.findall('.//item')):
              enc = item.find('enclosure')
              title = (item.findtext('title') or '').strip()

              title_en = ''
              title_fr = ''

              if title:
                  title_en = translate(title, 'en')
                  time.sleep(0.3)
                  title_fr = translate(title, 'fr')
                  time.sleep(0.3)
                  if title_en:
                      print(f'  [{i+1}] EN: {title_en[:60]}')

              items.append({
                  'title': title,
                  'title_en': title_en,
                  'title_fr': title_fr,
                  'link': (item.findtext('link') or '').strip(),
                  'description': (item.findtext('description') or '').strip(),
                  'image': enc.get('url','') if enc is not None else '',
                  'pubDate': (item.findtext('pubDate') or '').strip()
              })

          with open('feed.json','w',encoding='utf-8') as f:
              json.dump({'items': items, 'fetched': __import__('datetime').datetime.utcnow().isoformat()+'Z'}, f, ensure_ascii=False)
          print(f'{len(items)} articles saved')
          PYEOF
          rm -f feed.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Update feed.json" && git push
